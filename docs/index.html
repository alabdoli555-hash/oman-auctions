<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مزادات عُمان</title>
<meta name="theme-color" content="#b5121b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مزادات عُمان">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;
  --bg:light-dark(#ffffff,#121212);--ink:light-dark(#151515,#f1f1f1);--mute:light-dark(#5f6368,#a8adb4);
  --line:light-dark(#e6e6e6,#2a2a2a);--card:light-dark(#fafafa,#1b1b1b);
  --red:#b5121b;--red2:light-dark(#fdecec,#3a1416);
  --land:light-dark(#0f766e,#2dd4bf);--car:light-dark(#1d4ed8,#7aa2ff);--proj:light-dark(#a16207,#facc15);--num:light-dark(#7c3aed,#b79bff)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans Arabic",system-ui,Tahoma,sans-serif;overflow-x:clip}
h1,h2,.num{font-family:"Readex Pro","IBM Plex Sans Arabic",sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:0 max(4vw,16px)}
.hero{background:var(--red);color:#fff;padding:22px 0 26px}
.hero .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:clamp(30px,6vw,44px);line-height:1.05;margin:0}
.upd{font-size:13px;opacity:.85}
.next{margin-top:16px}
.next .lbl{font-size:14px;opacity:.9}
.clock{font-size:clamp(40px,11vw,76px);font-weight:700;line-height:1;direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.next a{color:#fff;font-weight:600;font-size:17px;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.5)}
.next .sub{font-size:14px;opacity:.9}
.rem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:18px}
.rem button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:14px;padding:9px;text-align:right;font:inherit;cursor:pointer;min-height:44px}
.rem button.on{background:#fff;color:var(--red)}
.rem b{display:block;font-family:"Readex Pro";font-size:24px;line-height:1.1}
.rem span{font-size:12.5px}
.alert{margin:14px auto 0;background:var(--red2);border-radius:14px;padding:12px 14px;font-size:15px;display:none}
.alert.show{display:block}
.bar{position:sticky;top:0;z-index:4;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 13px;font:inherit;font-size:14px;cursor:pointer;min-height:40px}
.tab.act{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab i{font-style:normal;opacity:.6;margin-inline-start:4px}
.more{display:none;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.more.open{display:grid}
.row2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:8px}
input,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;min-height:44px}
.fbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:0 14px;font:inherit;font-size:14px;cursor:pointer;min-height:44px;white-space:nowrap}
.fbtn.on{border-color:var(--red);color:var(--red)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--red);outline-offset:1px}
.day{margin-top:26px}
.day h2{font-size:20px;margin:0 0 4px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.day h2 small{font:500 13px "IBM Plex Sans Arabic";color:var(--mute)}
.item{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:12px;padding:14px 0;border-top:1px solid var(--line);align-items:start}
.time{font-family:"Readex Pro";font-size:20px;font-weight:600;line-height:1.15;direction:ltr;text-align:right}
.time small{display:block;font:12px "IBM Plex Sans Arabic";color:var(--mute);direction:rtl}
.t{font-weight:600;font-size:16.5px;line-height:1.45}
.t a{color:inherit;text-decoration:none}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;margin-inline-end:6px;vertical-align:2px;color:#fff;background:var(--c)}
.new{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--red);color:#fff;margin-inline-end:6px;vertical-align:2px}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:var(--mute);margin-top:3px}
.price{color:var(--ink);font-weight:600;white-space:nowrap}
.cd{font-size:13px;font-weight:600;color:var(--red);white-space:nowrap}
.cd.live{background:var(--red);color:#fff;padding:1px 8px;border-radius:999px}
.side{display:flex;flex-direction:column;align-items:center;gap:6px}
.star{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:20px;cursor:pointer;color:var(--mute)}
.star.on{color:#e0a800;border-color:#e0a800}
.go{font-size:13px;color:var(--red);font-weight:600;text-decoration:none;white-space:nowrap}
.empty{padding:40px 0;text-align:center;color:var(--mute)}
.src{margin:40px 0 30px;padding-top:20px;border-top:3px solid var(--ink)}
.src h2{font-size:22px;margin:0 0 6px}
.src p{color:var(--mute);margin:0 0 12px;font-size:14.5px}
.srcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.srcs a{display:block;border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-decoration:none;color:var(--ink);background:var(--card)}
.srcs b{display:flex;justify-content:space-between}.srcs span{font-size:13px;color:var(--mute)}
.srcs em{font-style:normal;font-size:13px;font-weight:700;color:var(--land)}
.srcs em.z{color:var(--mute);font-weight:500}
@media(max-width:600px){.more{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.more select:first-child{grid-column:1/-1}
  .item{grid-template-columns:58px minmax(0,1fr) auto;gap:10px}.time{font-size:18px}.rem b{font-size:21px}.rem span{font-size:11.5px}}
</style>
</head>
<body>
<section class="hero">
  <div class="wrap">
    <div class="top"><h1>مزادات عُمان</h1><div class="upd" id="upd">جاري التحميل…</div></div>
    <div class="next" id="next"></div>
    <div class="rem">
      <button data-v="today"><b id="nToday">0</b><span>اليوم</span></button>
      <button data-v="tomorrow"><b id="nTom">0</b><span>بكرة</span></button>
      <button data-v="new"><b id="nNew">0</b><span>🔴 جديد</span></button>
      <button data-v="fav"><b id="nFav">0</b><span>⭐ متابعاتي</span></button>
    </div>
  </div>
</section>
<div class="wrap"><div class="alert" id="alert"></div></div>
<div class="bar"><div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div class="row2">
    <input id="q" type="search" placeholder="بحث: ولاية، سيارة، رقم، سكني…" autocomplete="off">
    <button class="fbtn" id="fbtn">⚙︎ فلاتر</button>
  </div>
  <div class="more" id="more">
    <select id="when">
      <option value="">كل المواعيد</option><option value="0">اليوم</option><option value="1">بكرة</option><option value="2">بعد بكرة</option>
      <option value="w1">خلال أسبوع</option><option value="w2">خلال أسبوعين</option><option value="later">بعد أسبوعين</option>
    </select>
    <select id="gov"><option value="">كل المحافظات</option></select>
    <select id="site"><option value="">كل المنصات</option></select>
    <select id="price">
      <option value="">أي سعر</option><option value="1000">حتى 1,000 ر.ع</option><option value="5000">حتى 5,000 ر.ع</option>
      <option value="20000">حتى 20,000 ر.ع</option><option value="50000">حتى 50,000 ر.ع</option><option value="100000">حتى 100,000 ر.ع</option>
    </select>
    <select id="sort"><option value="time">الأقرب موعداً</option><option value="low">الأقل سعراً</option><option value="high">الأعلى سعراً</option><option value="new">الأحدث نزولاً</option></select>
  </div>
</div></div>
<main class="wrap" id="list"></main>
<section class="wrap src">
  <h2>المنصات</h2>
  <p>الرقم جنب كل منصة يعني كم إعلان قادم منها في الصفحة الحين. الصفحة تفحص كل المنصات كل ساعة.</p>
  <div class="srcs" id="srcs"></div>
</section>
<script>
{
const CAT={land:{n:"🏠 أراضي وعقارات",c:"var(--land)"},car:{n:"🚗 مركبات",c:"var(--car)"},proj:{n:"🏗️ مشاريع ومعدات",c:"var(--proj)"},num:{n:"🔢 أرقام مميزة",c:"var(--num)"}};
const DAYS=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const MONTHS=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const H=3600e3,D=24*H;
let items=[],view="all",cat="all";
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let fav=new Set(store.get("fav",[]));
const lastVisit=store.get("lastVisit",0);
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const omr=p=>p==null?"السعر غير معلن":Number(p).toLocaleString("en-US")+" ر.ع";
const mDay=t=>new Date(t+4*H).toISOString().slice(0,10);
const mTime=t=>new Date(t+4*H).toISOString().slice(11,16);
const dayIdx=t=>Math.round((Date.parse(mDay(t))-Date.parse(mDay(Date.now())))/D);
function dayName(d){const x=new Date(d+"T00:00:00Z");return DAYS[x.getUTCDay()]+" "+x.getUTCDate()+" "+MONTHS[x.getUTCMonth()]}
function left(ms){const m=Math.floor(ms/6e4),d=Math.floor(m/1440),h=Math.floor(m%1440/60),mm=m%60;
  if(d>0)return `${d} يوم${h?` و${h} ساعة`:""}`;if(h>0)return `${h} ساعة و${mm} دقيقة`;return `${mm} دقيقة`}
function clock(ms){const s=Math.floor(ms/1e3),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60,p=n=>String(n).padStart(2,"0");return (d?d+"d ":"")+p(h)+":"+p(m)+":"+p(x)}
// key time = start if in future, else end, else start
const key=i=>i.ts&&i.ts>Date.now()?i.ts:(i.te||i.ts||Infinity);
const alive=i=>{const last=i.te||(i.ts?i.ts+H:null);return last==null||last>Date.now()};
const isNew=i=>lastVisit&&i.fs>lastVisit;

async function load(){
  try{
    const r=await fetch("data.json?v="+Date.now(),{cache:"no-store"});
    const d=await r.json();
    items=d.items.map(i=>({...i,ts:i.start?Date.parse(i.start):null,te:i.end?Date.parse(i.end):null,fs:Date.parse(i.first_seen||d.updated)}));
    const u=Date.parse(d.updated);
    $("upd").textContent="آخر فحص: "+dayName(mDay(u))+" "+mTime(u);
    $("srcs").innerHTML=d.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener"><b>${esc(s.name)}<em class="${s.count?"":"z"}">${s.count?s.count+" إعلان":"لا يوجد حالياً"}</em></b><span>${esc(s.desc)}</span></a>`).join("");
    const fill=(id,arr,all)=>{$(id).innerHTML=`<option value="">${all}</option>`+arr.map(g=>`<option>${esc(g)}</option>`).join("")};
    fill("gov",[...new Set(items.map(i=>i.gov).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ar")),"كل المحافظات");
    fill("site",[...new Set(items.map(i=>i.src))],"كل المنصات");
  }catch(e){$("upd").textContent="تعذّر تحميل البيانات، حدّث الصفحة"}
  render();tick();
}

function bucket(i){
  const k=key(i);if(k===Infinity)return [9,"بدون موعد محدد"];
  const n=dayIdx(k);
  if(k<=Date.now())return [-1,"🔴 جاري الآن"];
  if(n<=0)return [0,"اليوم — "+dayName(mDay(k))];
  if(n===1)return [1,"بكرة — "+dayName(mDay(k))];
  if(n===2)return [2,"بعد بكرة — "+dayName(mDay(k))];
  if(n<=7)return [3,"خلال هذا الأسبوع"];
  if(n<=14)return [4,"الأسبوع الجاي"];
  if(n<=30)return [5,"بعد أسبوعين"];
  return [6,"بعد شهر وأكثر"];
}

function render(){
  const now=Date.now();
  const live=items.filter(alive);
  const by=n=>live.filter(i=>i.ts&&i.ts>now&&dayIdx(i.ts)===n);
  const nT=live.filter(i=>(i.ts&&dayIdx(i.ts)===0)||(i.ts<=now&&i.te>now)),nM=by(1),nN=live.filter(isNew),nF=live.filter(i=>fav.has(i.id));
  $("nToday").textContent=nT.length;$("nTom").textContent=nM.length;$("nNew").textContent=nN.length;$("nFav").textContent=nF.length;
  document.querySelectorAll(".rem button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
  const msgs=[];
  const fT=nF.filter(i=>i.ts&&dayIdx(i.ts)===0),fM=nF.filter(i=>i.ts&&dayIdx(i.ts)===1);
  if(fT.length)msgs.push(`⏰ <b>اليوم</b> من متابعاتك: ${fT.slice(0,3).map(i=>esc(i.title)+" الساعة "+mTime(i.ts)).join("، ")}`);
  if(fM.length)msgs.push(`📌 <b>بكرة</b> من متابعاتك: ${fM.slice(0,3).map(i=>esc(i.title)+" الساعة "+mTime(i.ts)).join("، ")}`);
  if(nN.length)msgs.push(`🔴 نزل ${nN.length} إعلان جديد من آخر زيارة لك.`);
  if(!fav.size)msgs.push(`اضغط ⭐ على أي مزاد يهمك عشان يطلع لك تذكيره هنا قبل موعده.`);
  $("alert").innerHTML=msgs.join("<br>");$("alert").classList.toggle("show",msgs.length>0);

  const cnt=k=>live.filter(i=>k==="all"||i.cat===k).length;
  $("tabs").innerHTML=[["all","الكل"],...Object.entries(CAT).map(([k,v])=>[k,v.n])]
    .map(([k,n])=>`<button class="tab ${cat===k?"act":""}" data-k="${k}">${n}<i>${cnt(k)}</i></button>`).join("");

  const q=$("q").value.trim(),g=$("gov").value,st=$("site").value,pr=+$("price").value||0,w=$("when").value,s=$("sort").value;
  $("fbtn").classList.toggle("on",!!(g||st||pr||w||s!=="time"));
  let L=live.filter(i=>(cat==="all"||i.cat===cat)&&(!g||i.gov===g)&&(!st||i.src===st)&&(!pr||(i.price!=null&&i.price<=pr))&&
    (!q||[i.title,i.place,i.gov,i.sub,i.note,i.src].join(" ").toLowerCase().includes(q.toLowerCase())));
  if(w){L=L.filter(i=>{const k=key(i);if(k===Infinity)return false;const n=dayIdx(k);
    return w==="w1"?n<=7:w==="w2"?n<=14:w==="later"?n>14:n===+w})}
  if(view==="today")L=L.filter(i=>nT.includes(i));
  if(view==="tomorrow")L=L.filter(i=>nM.includes(i));
  if(view==="new")L=L.filter(isNew);
  if(view==="fav")L=L.filter(i=>fav.has(i.id));
  if(!L.length){$("list").innerHTML=`<div class="empty">${view==="fav"?"ما تابعت أي مزاد بعد. اضغط ⭐ على الإعلان اللي يهمك.":"ما فيه مزادات بهذا الاختيار."}</div>`;return}

  const row=(i,showDay)=>{
    const c=CAT[i.cat]||CAT.proj,k=key(i);
    let cd="";
    if(i.ts&&i.ts>now)cd=`<span class="cd">يبدأ بعد ${left(i.ts-now)}</span>`;
    else if(i.te&&i.te>now)cd=`<span class="cd live">جاري • ينتهي بعد ${left(i.te-now)}</span>`;
    else if(i.ts)cd=`<span class="cd live">جاري الآن</span>`;
    const tm=k===Infinity?"—":mTime(k);
    return `<div class="item">
      <div class="time">${tm}<small>${showDay&&k!==Infinity?dayName(mDay(k)):""}</small></div>
      <div><div class="t">${isNew(i)?'<span class="new">جديد</span>':""}<span class="tag" style="--c:${c.c}">${esc(i.sub)}</span><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a></div>
        <div class="meta"><span class="price">💰 ${omr(i.price)}</span>${i.gov||i.place?`<span>📍 ${esc([i.gov,i.place].filter(Boolean).join(" — "))}</span>`:""}${i.area?`<span>📐 ${Number(i.area).toLocaleString("en-US")} م²</span>`:""}${cd}</div>
        <div class="meta"><span>${esc(i.src)}${i.note?" • "+esc(i.note):""}${i.te&&i.ts?" • ينتهي "+dayName(mDay(i.te))+" "+mTime(i.te):""}</span></div></div>
      <div class="side"><button class="star ${fav.has(i.id)?"on":""}" data-id="${esc(i.id)}" aria-label="متابعة">${fav.has(i.id)?"★":"☆"}</button><a class="go" href="${esc(i.url)}" target="_blank" rel="noopener">افتح ←</a></div>
    </div>`};

  if(s==="time"){
    L.sort((a,b)=>key(a)-key(b));
    const groups=[];L.forEach(i=>{const [o,label]=bucket(i);const dk=o<=2&&o>=0?label:o;let gr=groups.find(x=>x.k===dk);if(!gr)groups.push(gr={k:dk,o,label,a:[]});gr.a.push(i)});
    groups.sort((a,b)=>a.o-b.o);
    $("list").innerHTML=groups.map(gr=>`<section class="day"><h2>${gr.label}<small>${gr.a.length} مزاد</small></h2>${gr.a.map(i=>row(i,gr.o>2||gr.o<0)).join("")}</section>`).join("");
  }else{
    if(s==="new")L.sort((a,b)=>b.fs-a.fs);
    else L.sort((a,b)=>s==="low"?(a.price??1e12)-(b.price??1e12):(b.price??-1)-(a.price??-1));
    $("list").innerHTML=`<section class="day">${L.map(i=>row(i,true)).join("")}</section>`;
  }
}

function tick(){
  const now=Date.now(),n=items.filter(i=>i.ts&&i.ts>now).sort((a,b)=>a.ts-b.ts)[0];
  if(n){
    $("next").innerHTML=`<div class="lbl">المزاد الجاي يبدأ بعد</div>
      <div class="clock num">${clock(n.ts-now)}</div>
      <div><a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a></div>
      <div class="sub">${dayName(mDay(n.ts))} الساعة ${mTime(n.ts)} • ${omr(n.price)} • ${esc(n.src)}</div>`;
  }else if(items.length){$("next").innerHTML=`<div class="lbl">ما فيه مزادات قادمة حالياً</div>`}
}

document.addEventListener("click",e=>{
  const sb=e.target.closest(".star");
  if(sb){const id=sb.dataset.id;fav.has(id)?fav.delete(id):fav.add(id);store.set("fav",[...fav]);render();return}
  const tb=e.target.closest(".tab");if(tb){cat=tb.dataset.k;render();return}
  const rb=e.target.closest(".rem button");if(rb){view=view===rb.dataset.v?"all":rb.dataset.v;render();$("list").scrollIntoView({behavior:"smooth"});return}
  if(e.target.closest("#fbtn"))$("more").classList.toggle("open");
});
["q","gov","site","price","when","sort"].forEach(id=>$(id).addEventListener("input",render));
setInterval(tick,1000);setInterval(render,60000);setInterval(load,15*60000);
load();
setTimeout(()=>store.set("lastVisit",Date.now()),5000);
}
</script>
</body>
</html>
